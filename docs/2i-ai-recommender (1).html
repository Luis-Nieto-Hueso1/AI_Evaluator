<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Model Advisor — 2i Testing</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --2i-navy: #283583;
        --2i-cobalt: #004ad3;
        --2i-cornflower: #3561dd;
        --2i-green: #54d499;
        --2i-green-dark: #2faa72;
        --2i-green-pale: #eafaf3;
        --2i-lavender: #dbe6f9;
        --2i-slate: #1e2d70;
        --border: #dce6f7;
        --muted: #5a6a9a;
        --bg: #f4f7fc;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Epilogue", sans-serif;
        background: var(--bg);
        color: var(--2i-navy);
        min-height: 100vh;
      }
      a {
        color: var(--2i-cobalt);
        text-decoration: none;
      }

      .header {
        position: sticky;
        top: 0;
        z-index: 100;
        background: var(--2i-navy);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 28px;
        height: 56px;
      }
      .header-left {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .logo {
        width: 34px;
        height: 34px;
        background: var(--2i-green);
        color: var(--2i-navy);
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        font-size: 16px;
        flex-shrink: 0;
      }
      .header-title {
        color: #fff;
        font-weight: 700;
        font-size: 16px;
      }
      .header-cta {
        color: var(--2i-green);
        font-weight: 600;
        font-size: 13px;
        white-space: nowrap;
      }
      .header-cta:hover {
        color: var(--2i-green-dark);
      }

      .progress-wrap {
        height: 3px;
        background: var(--border);
      }
      .progress-bar {
        height: 3px;
        background: var(--2i-cornflower);
        transition: width 0.4s ease;
        width: 0%;
      }

      .step-indicators {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0;
        padding: 28px 0 8px;
      }
      .step-dot {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: 2px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 13px;
        color: var(--muted);
        background: #fff;
        position: relative;
        z-index: 1;
        transition: all 0.3s;
      }
      .step-dot.active {
        border-color: var(--2i-cornflower);
        color: var(--2i-cornflower);
        background: #fff;
      }
      .step-dot.completed {
        border-color: var(--2i-green);
        background: var(--2i-green);
        color: #fff;
      }
      .step-line {
        width: 48px;
        height: 2px;
        background: var(--border);
        transition: background 0.3s;
      }
      .step-line.completed {
        background: var(--2i-green);
      }

      .container {
        max-width: 780px;
        margin: 0 auto;
        padding: 0 20px 40px;
      }
      .step-title {
        text-align: center;
        font-size: 22px;
        font-weight: 700;
        margin: 18px 0 20px;
        color: var(--2i-navy);
      }

      .card-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
        gap: 12px;
        margin-bottom: 24px;
      }
      .card {
        background: #fff;
        border: 1.5px solid var(--border);
        border-radius: 12px;
        padding: 16px;
        cursor: pointer;
        transition: all 0.2s;
        position: relative;
        display: flex;
        align-items: flex-start;
        gap: 12px;
      }
      .card:hover {
        border-color: var(--2i-cornflower);
        box-shadow: 0 2px 12px rgba(53, 97, 221, 0.1);
      }
      .card.selected {
        border-color: var(--2i-cornflower);
        background: var(--2i-lavender);
      }
      .card-radio {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        border: 2px solid var(--border);
        flex-shrink: 0;
        margin-top: 2px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s;
      }
      .card.selected .card-radio {
        border-color: var(--2i-cornflower);
      }
      .card.selected .card-radio::after {
        content: "";
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--2i-cornflower);
      }
      .card-check {
        width: 18px;
        height: 18px;
        border-radius: 5px;
        border: 2px solid var(--border);
        flex-shrink: 0;
        margin-top: 2px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        color: #fff;
        transition: all 0.2s;
      }
      .card.selected .card-check {
        border-color: var(--2i-cornflower);
        background: var(--2i-cornflower);
      }
      .card-body {
        flex: 1;
        min-width: 0;
      }
      .card-icon {
        font-size: 20px;
        margin-bottom: 4px;
      }
      .card-label {
        font-weight: 700;
        font-size: 14px;
        color: var(--2i-navy);
        margin-bottom: 2px;
      }
      .card-desc {
        font-size: 12px;
        color: var(--muted);
        line-height: 1.4;
      }

      .nav-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 16px;
      }
      .btn {
        padding: 10px 24px;
        border-radius: 8px;
        border: none;
        font-family: "Epilogue", sans-serif;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.2s;
      }
      .btn-primary {
        background: var(--2i-navy);
        color: #fff;
      }
      .btn-primary:hover {
        background: var(--2i-slate);
      }
      .btn-primary:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .btn-outline {
        background: transparent;
        color: var(--2i-navy);
        border: 1.5px solid var(--border);
      }
      .btn-outline:hover {
        border-color: var(--2i-cornflower);
      }
      .btn-green {
        background: var(--2i-green);
        color: var(--2i-navy);
        font-weight: 700;
      }
      .btn-green:hover {
        background: var(--2i-green-dark);
      }
      .step-label {
        font-size: 13px;
        color: var(--muted);
        font-weight: 500;
      }

      .summary-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
        margin-bottom: 24px;
      }
      .tag {
        background: var(--2i-lavender);
        color: var(--2i-cobalt);
        border-radius: 6px;
        padding: 4px 10px;
        font-size: 11px;
        font-weight: 700;
      }

      .tier-label {
        font-size: 13px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin: 20px 0 10px;
        padding-left: 4px;
      }
      .tier-recommended {
        color: var(--2i-green-dark);
      }
      .tier-possible {
        color: var(--2i-cobalt);
      }
      .tier-not-ideal {
        color: var(--muted);
      }

      .rec-card {
        background: #fff;
        border: 1.5px solid var(--border);
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 12px;
      }
      .rec-card .badge {
        display: inline-block;
        border-radius: 6px;
        padding: 3px 10px;
        font-size: 11px;
        font-weight: 700;
        margin-bottom: 8px;
      }
      .badge-rec {
        background: var(--2i-green-pale);
        color: var(--2i-green-dark);
      }
      .badge-pos {
        background: var(--2i-lavender);
        color: var(--2i-cobalt);
      }
      .badge-not {
        background: #f0f0f5;
        color: var(--muted);
      }
      .rec-model {
        font-size: 18px;
        font-weight: 700;
        margin-bottom: 6px;
      }
      .rec-reason {
        font-size: 13px;
        color: var(--muted);
        font-style: italic;
        margin-bottom: 12px;
        line-height: 1.5;
      }
      .rec-section-title {
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.3px;
        color: var(--2i-navy);
        margin: 10px 0 4px;
      }
      .rec-list {
        list-style: none;
        padding: 0;
        margin: 0 0 6px;
      }
      .rec-list li {
        font-size: 13px;
        color: var(--2i-slate);
        padding: 2px 0 2px 16px;
        position: relative;
        line-height: 1.5;
      }
      .rec-list li::before {
        content: "";
        position: absolute;
        left: 0;
        top: 9px;
        width: 6px;
        height: 6px;
        border-radius: 50%;
      }
      .rec-list.strengths li::before {
        background: var(--2i-green);
      }
      .rec-list.limitations li::before {
        background: #f0a050;
      }
      .rec-deploy {
        font-size: 13px;
        color: var(--2i-slate);
        margin-top: 4px;
      }
      .rec-datasafety {
        background: #eef3ff;
        border-radius: 8px;
        padding: 12px;
        margin-top: 10px;
        font-size: 12px;
        color: var(--2i-slate);
        line-height: 1.5;
        display: flex;
        gap: 8px;
        align-items: flex-start;
      }
      .rec-datasafety .lock {
        font-size: 16px;
        flex-shrink: 0;
      }
      .deploy-link {
        display: inline-block;
        margin-top: 10px;
        color: var(--2i-cobalt);
        font-weight: 600;
        font-size: 13px;
      }
      .deploy-link:hover {
        color: var(--2i-cornflower);
      }
      .rec-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 8px;
      }

      .cta-box {
        background: var(--2i-navy);
        border-radius: 12px;
        padding: 32px;
        text-align: center;
        margin: 32px 0;
        color: #fff;
      }
      .cta-box h3 {
        font-size: 18px;
        font-weight: 700;
        margin-bottom: 6px;
      }
      .cta-box p {
        font-size: 14px;
        color: #abb8e0;
        margin-bottom: 16px;
      }
      .cta-box .btn-green {
        padding: 12px 28px;
        font-size: 15px;
      }

      .services-title {
        text-align: center;
        font-size: 18px;
        font-weight: 700;
        margin: 28px 0 14px;
      }
      .service-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
        gap: 12px;
        margin-bottom: 24px;
      }
      .service-card {
        background: #fff;
        border: 1.5px solid var(--border);
        border-radius: 12px;
        padding: 18px 14px;
        text-align: center;
        transition: all 0.2s;
        text-decoration: none;
        color: var(--2i-navy);
      }
      .service-card:hover {
        border-color: var(--2i-cornflower);
        box-shadow: 0 2px 12px rgba(53, 97, 221, 0.1);
      }
      .service-card .s-icon {
        font-size: 24px;
        margin-bottom: 6px;
      }
      .service-card .s-label {
        font-weight: 700;
        font-size: 13px;
      }

      .reset-row {
        display: flex;
        gap: 10px;
        justify-content: center;
        margin-top: 8px;
      }

      @media (max-width: 600px) {
        .card-grid {
          grid-template-columns: 1fr;
        }
        .service-grid {
          grid-template-columns: 1fr 1fr;
        }
        .container {
          padding: 0 14px 32px;
        }
        .step-title {
          font-size: 18px;
        }
      }
    </style>
  </head>
  <body>
    <header class="header">
      <div class="header-left">
        <div class="logo">2i</div>
        <span class="header-title">AI Model Advisor</span>
      </div>
      <a
        class="header-cta"
        href="https://2itesting.com/contact-us/"
        target="_blank"
        >Book a Discovery Session &rarr;</a
      >
    </header>
    <div class="progress-wrap">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="container">
      <div class="step-indicators" id="stepIndicators"></div>
      <div id="stepContent"></div>
      <div class="nav-row" id="navRow">
        <button class="btn btn-outline" id="btnBack" onclick="prevStep()">
          Back
        </button>
        <span class="step-label" id="stepLabel"></span>
        <button class="btn btn-primary" id="btnNext" onclick="nextStep()">
          Next
        </button>
      </div>
    </div>

      function getRecommendations(problem, cloud, constraints) {
        const recs = { recommended: [], possible: [], not_ideal: [] };
        const localOnly = constraints.includes("local-only");
        const cloudOnly = constraints.includes("cloud-only");
        const highSec = constraints.includes("high-security");
        const lowHW = constraints.includes("low-hw");
        const needsCitations = constraints.includes("citations");

        if (
          (localOnly || cloud === "local" || cloud === "on-prem") &&
          !cloudOnly
        ) {
          if (lowHW) {
            recs.recommended.push({
              model: "phi4",
              reason:
                "Tiny footprint — runs on CPU-only machines. Best choice under 16GB RAM.",
            });
            recs.possible.push({
              model: "llama",
              reason:
                "Slightly heavier than Phi-4 but stronger reasoning for complex tasks.",
            });
          } else {
            recs.recommended.push({
              model: "llama",
              reason:
                "Strong open-source model; runs fully air-gapped with no data egress.",
            });
            recs.recommended.push({
              model: "mistral",
              reason:
                "European model, excellent GDPR posture; self-hostable via Docker or Ollama.",
            });
            recs.possible.push({

      function finalise(
        recs,
        highSec,
        cloudOnly,
        lowHW,
        needsCitations,
        cloud,
      ) {
        if (highSec && !["azure", "m365"].includes(cloud)) {
          const i = recs.recommended.findIndex((r) => r.model === "gpt4o");
          if (i > -1) {
            const item = recs.recommended.splice(i, 1)[0];
            item.reason +=
              " (Note: validate your DPA — data leaves to OpenAI servers)";
            recs.possible.push(item);
          }
        }
        if (cloudOnly) {
          recs.recommended = recs.recommended.filter(
            (r) => !["llama", "phi4", "mistral"].includes(r.model),
          );
          recs.possible = recs.possible.filter(
            (r) => !["llama", "phi4", "mistral"].includes(r.model),
          );
        }
        if (lowHW && !recs.recommended.find((r) => r.model === "phi4")) {
          recs.recommended.unshift({
            model: "phi4",
            reason:
              "Designed for low-resource environments; runs on CPU-only machines.",
          });
        }
        if (
          needsCitations &&
          !["azure", "m365"].includes(cloud) &&
          !recs.recommended.find((r) => r.model === "claude") &&
          !recs.possible.find((r) => r.model === "claude")
        ) {
          recs.possible.unshift({
            model: "claude",
            reason:
              "Excellent at grounded, citation-aware responses — strong source attribution.",
          });
        }
        const seen = new Set();
        ["recommended", "possible", "not_ideal"].forEach((t) => {
          recs[t] = recs[t].filter((r) => {
            if (seen.has(r.model)) return false;
            seen.add(r.model);
            return true;
          });
        });
        if (recs.recommended.length === 0 && recs.possible.length > 0)
          recs.recommended.push(recs.possible.shift());
        if (recs.recommended.length > 2)
          recs.recommended = recs.recommended.slice(0, 2);
        if (recs.possible.length > 1) recs.possible = recs.possible.slice(0, 1);
        recs.not_ideal = recs.not_ideal.slice(0, 1);
        return recs;
      }

      function buildStepIndicators() {
        const c = document.getElementById("stepIndicators");
        let h = "";
        for (let i = 1; i <= 4; i++) {
          if (i > 1)
            h +=
              '<div class="step-line' +
              (currentStep > i - 1 ? " completed" : "") +
              '" id="line' +
              i +
              '"></div>';
          const cls =
            i === currentStep ? "active" : i < currentStep ? "completed" : "";
          h +=
            '<div class="step-dot ' +
            cls +
            '" id="dot' +
            i +
            '">' +
            (i < currentStep ? "✓" : i) +
            "</div>";
        }
        c.innerHTML = h;
      }

      function updateProgress() {
        const pct = currentStep === 4 ? 100 : ((currentStep - 1) / 3) * 100;
        document.getElementById("progressBar").style.width = pct + "%";
      }

      function buildGrid(items, type) {
        let h = '<div class="card-grid">';
        items.forEach((item) => {
          const sel =
            type === "radio-problem"
              ? selectedProblem === item.id
              : type === "radio-cloud"
                ? selectedCloud === item.id
                : selectedConstraints.includes(item.id);
          const indicator =
            type === "checkbox"
              ? '<div class="card-check">' + (sel ? "✓" : "") + "</div>"
              : '<div class="card-radio"></div>';
          h +=
            '<div class="card' +
            (sel ? " selected" : "") +
            '" data-id="' +
            item.id +
            '" data-type="' +
            type +
            '">' +
            indicator +
            '<div class="card-body"><div class="card-icon">' +
            (item.icon || "") +
            '</div><div class="card-label">' +
            item.label +
            '</div><div class="card-desc">' +
            item.desc +
            "</div></div></div>";
        });
        return h + "</div>";
      }

      function handleCardClick(e) {
        const card = e.target.closest(".card");
        if (!card) return;
        const id = card.dataset.id,
          type = card.dataset.type;
        if (type === "radio-problem") selectedProblem = id;
        else if (type === "radio-cloud") selectedCloud = id;
        else if (type === "checkbox") {
          const idx = selectedConstraints.indexOf(id);
          if (idx > -1) selectedConstraints.splice(idx, 1);
          else selectedConstraints.push(id);
        }
        renderStep();
        updateNavButtons();
      }

      function renderStep() {
        const sc = document.getElementById("stepContent");
        if (currentStep === 1)
          sc.innerHTML =
            '<h2 class="step-title">What problem are you trying to solve?</h2>' +
            buildGrid(PROBLEMS, "radio-problem");
        else if (currentStep === 2)
          sc.innerHTML =
            '<h2 class="step-title">Where will this run?</h2>' +
            buildGrid(CLOUDS, "radio-cloud");
        else if (currentStep === 3)
          sc.innerHTML =
            '<h2 class="step-title">Any environment constraints?</h2>' +
            buildGrid(CONSTRAINTS, "checkbox");
        else if (currentStep === 4) buildResults();
        sc.querySelectorAll(".card").forEach((c) =>
          c.addEventListener("click", handleCardClick),
        );
      }

          PROBLEMS.find((p) => p.id === selectedProblem)?.label || "";
        const cloudLabel =
          CLOUDS.find((c) => c.id === selectedCloud)?.label || "";

        let h =
          '<h2 class="step-title">Your AI Recommendations</h2><div class="summary-tags"><span class="tag">' +
          probLabel +
          '</span><span class="tag">' +
          cloudLabel +
          "</span>";
        selectedConstraints.forEach((c) => {
          const cl = CONSTRAINTS.find((x) => x.id === c);
          if (cl) h += '<span class="tag">' + cl.label + "</span>";
        });
        h += "</div>";

        function renderTier(label, items, tierClass, badgeClass) {
          if (!items.length) return "";
          let t =
            '<div class="tier-label ' + tierClass + '">' + label + "</div>";
          items.forEach((item) => {
            const m = MODEL_DB[item.model];
            if (!m) return;
            const isRec = tierClass === "tier-recommended";
            t +=
              '<div class="rec-card"><span class="badge ' +
              badgeClass +
              '">' +
              label +
              '</span><div class="rec-model">' +
              m.name +
              '</div><div class="rec-reason">“' +
              item.reason +
              "”</div>";
            t +=
              '<div class="rec-section-title">Strengths</div><ul class="rec-list strengths">' +
              m.strengths.map((s) => "<li>" + s + "</li>").join("") +
              "</ul>";
            t +=
              '<div class="rec-section-title">Limitations</div><ul class="rec-list limitations">' +
              m.limitations.map((l) => "<li>" + l + "</li>").join("") +
              "</ul>";
            t +=
              '<div class="rec-section-title">Deployment Route</div><div class="rec-deploy">' +
              m.deployment +
              "</div>";
            t +=
              '<div class="rec-datasafety"><span class="lock">\u{1F512}</span><span>' +
              m.dataSafety +
              "</span></div>";
            t +=
              '<div class="rec-tags">' +
              m.tags
                .map((tg) => '<span class="tag">' + tg + "</span>")
                .join("") +
              "</div>";
            if (isRec) {
              if (selectedProblem === "synthetic-data")
                t +=
                  '<a class="deploy-link" href="https://2itesting.com/capabilities/quality-assurance-software-testing/synthetic-data/" target="_blank">\u{1F9EC} See 2i Synthetic Data Services →</a>';
              else
                t +=
                  '<a class="deploy-link" href="https://2itesting.com/contact-us/" target="_blank">Deploy this with 2i →</a>';
            }
            t += "</div>";
          });
          return t;
        }

        h += renderTier(
          "Recommended",
          recs.recommended,
          "tier-recommended",
          "badge-rec",
        );
        h += renderTier(
          "Possible",
          recs.possible,
          "tier-possible",
          "badge-pos",
        );
        h += renderTier(
          "Not Ideal",
          recs.not_ideal,
          "tier-not-ideal",
          "badge-not",
        );

        h +=
          '<div class="cta-box"><h3>95% of AI pilots fail to reach production.</h3><p>2i makes sure yours isn’t one of them.</p><a class="btn btn-green" href="https://2itesting.com/contact-us/" target="_blank">Book a Free Discovery Session →</a></div>';
        h +=
          '<div class="services-title">What 2i can do for you</div><div class="service-grid">';
        h +=
          '<a class="service-card" href="https://2itesting.com/capabilities/ai-assurance/" target="_blank"><div class="s-icon">\u{1F6E1}️</div><div class="s-label">AI Assurance</div></a>';
        h +=
          '<a class="service-card" href="https://2itesting.com/capabilities/quality-assurance-software-testing/test-automation-services/" target="_blank"><div class="s-icon">⚙️</div><div class="s-label">Test Automation</div></a>';
        h +=
          '<a class="service-card" href="https://2itesting.com/capabilities/strategic-test-consultancy/" target="_blank"><div class="s-icon">\u{1F4C8}</div><div class="s-label">Strategic Consultancy</div></a>';
        h +=
          '<a class="service-card" href="https://2itesting.com/capabilities/quality-assurance-software-testing/synthetic-data/" target="_blank"><div class="s-icon">\u{1F9EC}</div><div class="s-label">Synthetic Data</div></a>';
        h += "</div>";
        h +=
          '<div class="reset-row"><button class="btn btn-outline" onclick="prevStep()">Back</button><button class="btn btn-primary" onclick="resetWizard()">Start Over</button></div>';
        sc.innerHTML = h;
      }

      function updateNavButtons() {
        const nav = document.getElementById("navRow"),
          back = document.getElementById("btnBack"),
          next = document.getElementById("btnNext"),
          label = document.getElementById("stepLabel");
        if (currentStep === 4) {
          nav.style.display = "none";
          return;
        }
        nav.style.display = "flex";
        back.style.display = currentStep === 1 ? "none" : "inline-block";
        label.textContent = "Step " + currentStep + " of 3";
        if (currentStep === 1) next.disabled = !selectedProblem;
        else if (currentStep === 2) next.disabled = !selectedCloud;
        else next.disabled = false;
        next.textContent = currentStep === 3 ? "See Recommendations" : "Next";
      }

      function showStep(n) {
        currentStep = n;
        renderStep();
        buildStepIndicators();
        updateProgress();
        updateNavButtons();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
      function nextStep() {
        if (currentStep < 4) showStep(currentStep + 1);
      }
      function prevStep() {
        if (currentStep > 1) showStep(currentStep - 1);
      }
      function resetWizard() {
        selectedProblem = null;
        selectedCloud = null;
        selectedConstraints = [];
        showStep(1);
      }

      showStep(1);
    </script>
  </body>
</html>
