    <style>
      :root {
        --bg: #09090b;
        --surface: #18181b;
        --border: #27272a;
        --text: #fafafa;
        --muted: #a1a1aa;
        --violet: #8b5cf6;
        --violet-dim: rgba(139, 92, 246, 0.1);
        --emerald: #34d399;
        --emerald-dim: rgba(52, 211, 153, 0.1);
        --amber: #fbbf24;
        --amber-dim: rgba(251, 191, 36, 0.1);
        --rose: #fb7185;
        --rose-dim: rgba(251, 113, 133, 0.1);
        --blue: #60a5fa;
        --blue-dim: rgba(96, 165, 250, 0.1);
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      h1 {
        text-align: center;
        font-size: 2rem;
        font-weight: 800;
        padding: 32px 0 8px;
      }
      .subtitle {
        text-align: center;
        color: var(--muted);
        font-size: 1rem;
        margin-bottom: 24px;
      }

      /* Tab selector */
      .tabs {
        display: flex;
        justify-content: center;
        gap: 8px;
        margin-bottom: 32px;
        flex-wrap: wrap;
        padding: 0 16px;
      }
      .tab {
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--muted);
        padding: 8px 18px;
        border-radius: 10px;
        cursor: pointer;
        font-size: 0.9rem;
        font-weight: 600;
        transition: all 0.2s;
      }
      .tab:hover {
        color: var(--text);
        border-color: var(--violet);
      }
      .tab.active {
        background: var(--violet);
        color: white;
        border-color: var(--violet);
      }

      /* Diagram container */
      .diagram {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 24px 40px;
        display: none;
      }
      .diagram.active {
        display: block;
      }

      /* SVG styles */
      svg {
        width: 100%;
        height: auto;
      }
      .node {
        cursor: pointer;
        transition: all 0.2s;
      }
      .node:hover rect,
      .node:hover ellipse {
        filter: brightness(1.2);
        stroke-width: 3;
      }
      .node-label {
        font-size: 13px;
        font-weight: 600;
        fill: var(--text);
        pointer-events: none;
      }
      .node-sub {
        font-size: 10px;
        fill: var(--muted);
        pointer-events: none;
      }
      .edge {
        stroke-width: 1.5;
        fill: none;
      }
      .edge-label {
        font-size: 9px;
        fill: var(--muted);
      }
      .layer-label {
        font-size: 14px;
        font-weight: 700;
        fill: var(--violet);
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }
      .layer-bg {
        rx: 12;
        fill: var(--surface);
        stroke: var(--border);
        stroke-width: 1;
      }

      /* Detail panel */
      .detail {
        position: fixed;
        right: 24px;
        top: 24px;
        width: 340px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 24px;
        z-index: 50;
        display: none;
        max-height: 90vh;
        overflow-y: auto;
      }
      .detail.show {
        display: block;
        animation: slideIn 0.3s ease;
      }
      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateX(20px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .detail h3 {
        font-size: 1.2rem;
        font-weight: 700;
        margin-bottom: 8px;
      }
      .detail .badge {
        display: inline-block;
        padding: 3px 10px;
        border-radius: 999px;
        font-size: 0.75rem;
        font-weight: 600;
        margin: 2px;
      }
      .detail p {
        font-size: 0.9rem;
        color: var(--muted);
        line-height: 1.6;
        margin-top: 8px;
      }
      .detail .close-btn {
        position: absolute;
        top: 12px;
        right: 12px;
        background: none;
        border: none;
        color: var(--muted);
        font-size: 1.2rem;
        cursor: pointer;
        padding: 4px 8px;
      }
      .detail .close-btn:hover {
        color: var(--text);
      }
      .detail table {
        width: 100%;
        margin-top: 12px;
        border-collapse: collapse;
      }
      .detail th,
      .detail td {
        padding: 6px 8px;
        text-align: left;
        font-size: 0.85rem;
        border-bottom: 1px solid var(--border);
      }
      .detail th {
        color: var(--violet);
        font-weight: 600;
      }
      .detail td {
        color: var(--muted);
      }
      .detail ul {
        margin-top: 8px;
        padding-left: 16px;
      }
      .detail li {
        font-size: 0.85rem;
        color: var(--muted);
        line-height: 1.6;
      }

      /* Legend */
      .legend {
        display: flex;
        justify-content: center;
        gap: 24px;
        margin-top: 16px;
        flex-wrap: wrap;
      }
      .legend-item {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 0.85rem;
        color: var(--muted);
      }
      .legend-dot {
        width: 12px;
        height: 12px;
        border-radius: 4px;
      }
    </style>
  </head>

      function showDiagram(id) {
        document
          .querySelectorAll(".diagram")
          .forEach((d) => d.classList.remove("active"));
        document
          .querySelectorAll(".tab")
          .forEach((t) => t.classList.remove("active"));
        document.getElementById("d-" + id).classList.add("active");
        event.target.classList.add("active");
        hideDetail();
      }

      function showDetail(key) {
        const d = DETAILS[key];
        if (!d) return;
        const panel = document.getElementById("detail-panel");
        const content = document.getElementById("detail-content");

        let html = `<h3 style="color:${d.color}">${d.title}</h3>`;
        if (d.badges)
          html += d.badges
            .map(
              (b) =>
                `<span class="badge" style="background:${d.color}20;color:${d.color};border:1px solid ${d.color}44">${b}</span>`,
            )
            .join("");
        if (d.desc) html += `<p>${d.desc}</p>`;
        if (d.table) {
          html += "<table>";
          d.table.forEach((row, i) => {
            html +=
              "<tr>" +
              row
                .map((c) => (i === 0 ? `<th>${c}</th>` : `<td>${c}</td>`))
                .join("") +
              "</tr>";
          });
          html += "</table>";
        }
        if (d.list) {
          html +=
            "<ul>" + d.list.map((l) => `<li>${l}</li>`).join("") + "</ul>";
        }

        content.innerHTML = html;
        panel.classList.add("show");
      }

      function hideDetail() {
        document.getElementById("detail-panel").classList.remove("show");
      }
